# Scale inference replicas on CPU. For GPU pools, scale on a request metric instead
# (e.g. rate(forensix_requests_total) via prometheus-adapter or KEDA): GPU nodes don't
# report useful CPU utilization for this workload.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: forensix-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forensix-inference
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600   # new replicas take minutes to load models: don't flap
