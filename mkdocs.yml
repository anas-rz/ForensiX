site_name: ForensiX
site_description: Deepfake detection and media forensics. Commercially licensed detectors behind one Python API, an HTTP server and a web manager.
site_url: https://anas-rz.github.io/ForensiX/
repo_url: https://github.com/anas-rz/ForensiX
repo_name: anas-rz/ForensiX
edit_uri: edit/main/docs/
copyright: All bundled models and weights are under commercially usable licenses.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github

hooks:
  - docs/hooks.py   # adds README/LEADERBOARD/benchmarks to the site and fixes links that leave docs/

exclude_docs: |
  hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

validation:
  links:
    anchors: warn

nav:
  - Home: README.md
  - Getting started:
      - Quickstart: getting-started.md
      - Installation: guides/installation.md
      - Concepts: concepts.md
      - Recipes: recipes.md
      - Working in Google Colab: guides/colab.md
  - Guides:
      - Choosing detectors: guides/choosing-detectors.md
      - Interpreting scores: guides/interpreting-scores.md
      - Evaluating on your data: guides/evaluation.md
      - Identity and person models: guides/identity.md
      - Physics forensics: guides/physics.md
      - Fine-tuning on your data: guides/finetuning.md
      - Parameter-efficient fine-tuning (PEFT): guides/peft.md
      - Training models: guides/training.md
      - Extending ForensiX: guides/extending.md
      - Licensing and compliance: guides/licensing.md
  - Server and web manager:
      - HTTP server: server.md
      - Web manager: ui.md
      - Calibration: calibration.md
      - Provenance: provenance.md
      - Fairness reports: fairness.md
  - Deployment:
      - Docker, Kubernetes and cloud: cloud.md
      - AWS (ECS and EKS): aws.md
      - Google Cloud (Cloud Run and GKE): gcp.md
      - Azure (Container Apps and AKS): azure.md
      - Deployment at scale: deployment.md
  - Reference:
      - API reference: api-reference.md
      - Models: reference/models.md
      - Leaderboard: reference/leaderboard.md
      - Benchmarks:
          - Video and image (SDFVD): reference/benchmark-video-image.md
          - Audiovisual: reference/benchmark-audiovisual.md
          - Identity: reference/benchmark-identity.md
          - Physics: reference/benchmark-physics.md
