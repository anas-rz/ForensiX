# GPU nodes for the eks-gpu overlay: Auto Mode launches NVIDIA instances (drivers and device
# plugin included) when GPU pods are pending, and removes them when they're idle. The taint
# keeps other pods off them; the ForensiX pods tolerate it.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default
      requirements:
        - { key: eks.amazonaws.com/instance-family, operator: In, values: [g6, g6e, g5] }
        - { key: eks.amazonaws.com/instance-gpu-count, operator: In, values: ["1"] }
        - { key: karpenter.sh/capacity-type, operator: In, values: [on-demand] }
      taints:
        - { key: nvidia.com/gpu, effect: NoSchedule }
  limits:
    nvidia.com/gpu: 8
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
