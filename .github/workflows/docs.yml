# Documentation site (mkdocs.yml, docs/).
# - pull requests: build with --strict, so broken links and anchors fail the check
# - pushes to main and manual runs: build and publish to the gh-pages branch (GitHub Pages)
name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # mkdocs gh-deploy pushes the built site to the gh-pages branch

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gh-deploy commits on top of the existing gh-pages history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The site doesn't import forensix, so only the docs tools are needed (the "docs" extra in
      # pyproject.toml), not the package and PyTorch.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs>=1.6" "mkdocs-material>=9.5"

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build documentation (PR check)
        if: github.event_name == 'pull_request'
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        run: mkdocs gh-deploy --force --strict
