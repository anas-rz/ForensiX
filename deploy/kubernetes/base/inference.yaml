# Inference replicas: /v1/detect at scale. Prediction-only (admin_endpoints off); they read
# the active calibrations and identity galleries the manager writes to the shared volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forensix-inference
  labels:
    app.kubernetes.io/name: forensix
    app.kubernetes.io/component: inference
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forensix
      app.kubernetes.io/component: inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forensix
        app.kubernetes.io/component: inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: forensix
              app.kubernetes.io/component: inference
      containers:
        - name: forensix
          image: forensix
          imagePullPolicy: IfNotPresent
          args: ["python", "-m", "forensix.server"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: FORENSIX_SERVER_CONFIG
              value: /etc/forensix/server.json
            - name: FORENSIX_SERVER_DEVICE
              value: cpu
            - name: FORENSIX_SERVER_ADMIN_ENDPOINTS
              value: "false"
            - name: FORENSIX_SERVER_UI
              value: "false"
            - name: OMP_NUM_THREADS
              value: "4"
          envFrom:
            - secretRef:
                name: forensix-keys
          resources:
            requests:
              cpu: "4"
              memory: 12Gi
            limits:
              memory: 16Gi
          lifecycle:
            preStop:             # let the load balancer drop this pod before it stops accepting
              exec:
                command: ["sleep", "10"]
          startupProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: config, mountPath: /etc/forensix, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap:
            name: forensix-config
        - name: data
          persistentVolumeClaim:
            claimName: forensix-data
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: forensix-inference
spec:
  selector:
    app.kubernetes.io/name: forensix
    app.kubernetes.io/component: inference
  ports:
    - name: http
      port: 80
      targetPort: http
