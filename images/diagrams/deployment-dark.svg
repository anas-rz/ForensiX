<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Deployment: a load balancer sends management paths to a single manager and detection to autoscaled inference replicas; both share storage for calibrations and datasets. Runs on Kubernetes, AWS, Google Cloud and Azure."><title>Deployment: a load balancer sends management paths to a single manager and detection to autoscaled inference replicas; both share storage for calibrations and datasets. Runs on Kubernetes, AWS, Google Cloud and Azure.</title><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#5f6f86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#6ea8ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#3ed3bd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#b294ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#f5b544" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#ff7a93" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/></filter></defs><rect width="960" height="560" rx="16" fill="#0d1117"/><rect x="380" y="28" width="200" height="44" rx="22" fill="#161e2b" stroke="#2d3a4f" stroke-width="1" filter="url(#shadow)"/><text x="480" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Clients and web console</text><path d="M 480 74 L 480 96" fill="none" stroke="#5f6f86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-arrow)"/><rect x="330" y="100" width="300" height="58" rx="14" fill="#161e2b" stroke="#2d3a4f" stroke-width="1" filter="url(#shadow)"/><text x="480" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3" text-anchor="middle">Load balancer</text><text x="480" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="middle">one host, TLS, routes by path</text><path d="M 380 160 L 380 178 Q 380 190 368 190 L 210 190 Q 198 190 198 202 L 198 244" fill="none" stroke="#b294ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-violet)"/><path d="M 580 160 L 580 178 Q 580 190 592 190 L 750 190 Q 762 190 762 202 L 762 244" fill="none" stroke="#6ea8ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="48" y="204" width="300" height="24" rx="12" fill="#241b3d" stroke="#241b3d" stroke-width="1"/><text x="198" y="220" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#b294ff" text-anchor="middle">/ui  /v1/datasets  /v1/calibrations ...</text><rect x="660" y="204" width="204" height="24" rx="12" fill="#15233d" stroke="#15233d" stroke-width="1"/><text x="762" y="220" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#6ea8ff" text-anchor="middle">/v1/detect and the rest</text><rect x="68" y="250" width="260" height="112" rx="12" fill="#161e2b" stroke="#2d3a4f" stroke-width="1" filter="url(#shadow)"/><rect x="68" y="262" width="3" height="88" rx="1.5" fill="#b294ff"/><text x="86" y="281" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3" text-anchor="start">Manager</text><text x="86" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="start">One replica: the single writer.</text><text x="86" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="start">Web console, dataset uploads,</text><text x="86" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="start">calibration and fairness jobs</text><rect x="652" y="234" width="260" height="112" rx="12" fill="#161e2b" stroke="#2d3a4f" stroke-width="1"/><rect x="642" y="242" width="260" height="112" rx="12" fill="#161e2b" stroke="#2d3a4f" stroke-width="1"/><rect x="632" y="250" width="260" height="112" rx="12" fill="#161e2b" stroke="#2d3a4f" stroke-width="1" filter="url(#shadow)"/><rect x="632" y="262" width="3" height="88" rx="1.5" fill="#6ea8ff"/><text x="650" y="281" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3" text-anchor="start">Inference replicas</text><text x="650" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="start">Autoscaled on load, CPU or GPU.</text><text x="650" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="start">Prediction only: refuse writes,</text><text x="650" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="start">read calibrations live</text><path d="M 340 404 L 340 478 A 140 16 0 0 0 620 478 L 620 404 " fill="#161e2b" stroke="#2d3a4f" stroke-width="1" filter="url(#shadow)"/><ellipse cx="480" cy="404" rx="140" ry="16" fill="#1a2331" stroke="#2d3a4f"/><text x="480" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3" text-anchor="middle">Shared storage</text><text x="480" y="467" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="middle">calibrations, datasets, galleries</text><path d="M 198 364 L 198 428 Q 198 440 210 440 L 330 440" fill="none" stroke="#b294ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-violet)"/><text x="206" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#b294ff" text-anchor="start">writes</text><path d="M 762 364 L 762 428 Q 762 440 750 440 L 630 440" fill="none" stroke="#6ea8ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><text x="754" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6ea8ff" text-anchor="end">reads</text><text x="40" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#6b7a90" text-anchor="start" letter-spacing="1.2">RUNS ON</text><rect x="110" y="526" width="101.16000000000001" height="21" rx="10.5" fill="#10302c" stroke="#10302c" stroke-width="1"/><text x="160.58" y="539.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#3ed3bd" text-anchor="middle">Docker Compose</text><rect x="219.16000000000003" y="526" width="77.4" height="21" rx="10.5" fill="#10302c" stroke="#10302c" stroke-width="1"/><text x="257.86" y="539.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#3ed3bd" text-anchor="middle">Kubernetes</text><rect x="304.56000000000006" y="526" width="95.22" height="21" rx="10.5" fill="#10302c" stroke="#10302c" stroke-width="1"/><text x="352.1700000000001" y="539.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#3ed3bd" text-anchor="middle">AWS: ECS, EKS</text><rect x="407.7800000000001" y="526" width="184.32000000000002" height="21" rx="10.5" fill="#10302c" stroke="#10302c" stroke-width="1"/><text x="499.9400000000001" y="539.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#3ed3bd" text-anchor="middle">Google Cloud: Cloud Run, GKE</text><rect x="600.1000000000001" y="526" width="172.44" height="21" rx="10.5" fill="#10302c" stroke="#10302c" stroke-width="1"/><text x="686.3200000000002" y="539.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#3ed3bd" text-anchor="middle">Azure: Container Apps, AKS</text></svg>
