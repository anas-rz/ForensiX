ne" stroke="#e11d48" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06"/></filter></defs><rect width="960" height="330" rx="16" fill="#ffffff"/><path d="M 24 66 L 24 58 L 634 58 L 634 66" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/><text x="329.0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="1.2">BUILD ON YOUR DATA</text><path d="M 656 66 L 656 58 L 950 58 L 950 66" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/><text x="803.0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0d9488" text-anchor="middle" letter-spacing="1.2">RUN IN PRODUCTION</text><rect x="24" y="92" width="136" height="112" rx="14" fill="#ffffff" stroke="#d0d7e2" stroke-width="1" filter="url(#shadow)"/><circle cx="50" cy="118" r="12" fill="#2563eb"/><text x="50" y="122.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="68" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#0f172a" text-anchor="start">Measure</text><text x="42" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6577" text-anchor="start">accuracy on</text><text x="42" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b6577" text-anchor="start">your data</text><