[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensix"
version = "0.1.0"
description = "A PyTorch model zoo for deepfake detection and multimodal media forensics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision",
    "pillow",
    "safetensors",
    "numpy",
    "scipy",
    "soundfile>=0.12",
    "transformers>=4.40",
    "timm",
    "PyWavelets",
    "open_clip_torch",
    "opencv-python-headless",
    "einops",
    "mediapipe",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
# provenance checks: C2PA Content Credentials and the AudioSeal watermark (MIT / Apache-2.0)
provenance = ["c2pa-python>=0.38", "audioseal>=0.2", "omegaconf>=2.3"]
# HTTP server (python -m forensix.server), with the provenance checks it runs by default
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9",
          "c2pa-python>=0.38", "audioseal>=0.2", "omegaconf>=2.3"]
# parameter-efficient fine-tuning (python -m forensix.finetuning --mode lora); not needed to serve the result
finetune = ["peft>=0.13"]
# documentation site (mkdocs serve / mkdocs build)
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
# building the image evaluation set (scripts/build_image_eval_set.py)
eval = ["diffusers", "accelerate", "sentencepiece", "protobuf"]

[tool.setuptools.packages.find]
include = ["forensix*"]

[tool.setuptools.package-data]
"forensix.audio.aasist" = ["LICENSE"]
"forensix.audio.rawgat_st" = ["LICENSE"]
"forensix.audio.xlsr_aasist" = ["LICENSE"]
"forensix.audio.nes2net_x" = ["LICENSE"]
"forensix.image.univfd" = ["LICENSE"]
"forensix.image.rine" = ["LICENSE"]
"forensix.image.commfor" = ["LICENSE"]
"forensix.image.safe" = ["LICENSE"]
"forensix.image.clipdet" = ["LICENSE"]
"forensix.video.mtcnn" = ["LICENSE"]
"forensix.video.dfdc_selim" = ["LICENSE"]
"forensix.video.gend" = ["LICENSE"]
"forensix.video.dfdc_wm" = ["LICENSE", "LICENSE-xception", "LICENSE-wsdan"]
"forensix.video.retinaface" = ["LICENSE"]
"forensix.audiovisual" = ["LICENSE-syncnet"]
"forensix.audiovisual.avad" = ["LICENSE"]
"forensix.audiovisual.stablesyncnet" = ["LICENSE", "LICENSE-WEIGHTS-OpenRAIL++-M.txt"]
"forensix.audiovisual.avid" = ["LICENSE-speechbrain"]
"forensix.physics.face" = ["ict_manifest.json", "LICENSE-ICT-FaceKit"]
"forensix.physics" = ["learned_priors.json"]
"forensix.server" = ["static/*"]
"forensix.provenance.imwatermark" = ["LICENSE"]
"forensix.video.dfdc_wm.efficientnet_pytorch" = ["LICENSE"]
