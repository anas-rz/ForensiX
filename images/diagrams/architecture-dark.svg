<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="How ForensiX works: media comes in through the Python API, HTTP API or web console; the engine prepares it, runs detectors and provenance checks, fuses and calibrates the scores, and returns a verdict with evidence."><title>How ForensiX works: media comes in through the Python API, HTTP API or web console; the engine prepares it, runs detectors and provenance checks, fuses and calibrates the scores, and returns a verdict with evidence.</title><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#5f6f86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#6ea8ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#3ed3bd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#b294ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#f5b544" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5" fill="none" stroke="#ff7a93" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/></filter></defs><rect width="960" height="640" rx="16" fill="#0d1117"/><text x="40" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6b7a90" text-anchor="start" letter-spacing="1.2">YOUR MEDIA</text><rect x="40" y="60" width="128" height="40" rx="20" fill="#161e2b" stroke="#2d3a4f" stroke-width="1" filter="url(#shadow)"/><text x="104" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Images</text><rect x="180" y="60" width="128" height="40" rx="20" fill="#161e2b" stroke="#2d3a4f" stroke-width="1" filter="url(#shadow)"/><text x="244" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Video</text><rect x="320" y="60" width="150" height="40" rx="20" fill="#161e2b" stroke="#2d3a4f" stroke-width="1" filter="url(#shadow)"/><text x="395" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Audio and voice</text><text x="520" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6b7a90" text-anchor="start" letter-spacing="1.2">WAYS IN</text><rect x="520" y="60" width="128" height="58" rx="12" fill="#161e2b" stroke="#2d3a4f" stroke-width="1" filter="url(#shadow)"/><text x="584" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Python API</text><text x="584" y="102" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6ea8ff" text-anchor="middle">forensix.load()</text><path d="M 584 120 L 584 140" fill="none" stroke="#5f6f86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="656" y="60" width="128" height="58" rx="12" fill="#161e2b" stroke="#2d3a4f" stroke-width="1" filter="url(#shadow)"/><text x="720" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="middle">HTTP API</text><text x="720" y="102" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6ea8ff" text-anchor="middle">POST /v1/detect</text><path d="M 720 120 L 720 140" fill="none" stroke="#5f6f86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="792" y="60" width="128" height="58" rx="12" fill="#161e2b" stroke="#2d3a4f" stroke-width="1" filter="url(#shadow)"/><text x="856" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf3" text-anchor="middle">Web console</text><text x="856" y="102" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#6ea8ff" text-anchor="middle">/ui</text><path d="M 856 120 L 856 140" fill="none" stroke="#5f6f86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 465 80 L 505 80" fill="none" stroke="#5f6f86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-arrow)"/><path d="M 584 140 L 856 140" fill="none" stroke="#5f6f86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 720 140 L 720 156 Q 720 164 712 164 L 488 164 Q 480 164 480 172 L 480 180" fill="none" stroke="#5f6f86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-arrow)"/><rect x="24" y="184" width="912" height="300" rx="18" fill="#131a24" stroke="#263041" stroke-width="1"/><text x="48" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6b7a90" text-anchor="start" letter-spacing="1.2">FORENSIX ENGINE</text><rect x="48" y="236" width="204" height="124" rx="12" fill="#161e2b" stroke="#2d3a4f" stroke-width="1" filter="url(#shadow)"/><rect x="48" y="248" width="3" height="100" rx="1.5" fill="#6ea8ff"/><circle cx="76" cy="262" r="12" fill="#6ea8ff"/><text x="76" y="266.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d1117" text-anchor="middle">1</text><text x="96" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3" text-anchor="start">Prepare</text><text x="66" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="start">Decode, sample frames,</text><text x="66" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="start">find faces, cut audio</text><text x="66" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="start">into windows</text><path d="M 256 298 L 264 298" fill="none" stroke="#5f6f86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-arrow)"/><rect x="268" y="236" width="204" height="124" rx="12" fill="#161e2b" stroke="#2d3a4f" stroke-width="1" filter="url(#shadow)"/><rect x="268" y="248" width="3" height="100" rx="1.5" fill="#6ea8ff"/><circle cx="296" cy="262" r="12" fill="#6ea8ff"/><text x="296" y="266.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d1117" text-anchor="middle">2</text><text x="316" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3" text-anchor="start">Detect</text><text x="286" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="start">39 detectors: image, video,</text><text x="286" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="start">audio, lip-sync, physics,</text><text x="286" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="start">identity</text><path d="M 476 298 L 484 298" fill="none" stroke="#5f6f86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-arrow)"/><rect x="488" y="236" width="204" height="124" rx="12" fill="#161e2b" stroke="#2d3a4f" stroke-width="1" filter="url(#shadow)"/><rect x="488" y="248" width="3" height="100" rx="1.5" fill="#b294ff"/><circle cx="516" cy="262" r="12" fill="#b294ff"/><text x="516" y="266.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d1117" text-anchor="middle">3</text><text x="536" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3" text-anchor="start">Fuse</text><text x="506" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="start">Optional: one score from</text><text x="506" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="start">several models, with</text><text x="506" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="start">fitted weights</text><path d="M 696 298 L 704 298" fill="none" stroke="#5f6f86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-arrow)"/><rect x="708" y="236" width="204" height="124" rx="12" fill="#161e2b" stroke="#2d3a4f" stroke-width="1" filter="url(#shadow)"/><rect x="708" y="248" width="3" height="100" rx="1.5" fill="#b294ff"/><circle cx="736" cy="262" r="12" fill="#b294ff"/><text x="736" y="266.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d1117" text-anchor="middle">4</text><text x="756" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3" text-anchor="start">Calibrate</text><text x="726" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="start">Probability, a threshold</text><text x="726" y="311" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="start">for your false-alarm rate,</text><text x="726" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="start">a confidence verdict</text><rect x="48" y="380" width="864" height="84" rx="12" fill="#161e2b" stroke="#2d3a4f" stroke-width="1" filter="url(#shadow)"/><rect x="48" y="392" width="3" height="60" rx="1.5" fill="#3ed3bd"/><text x="68" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#e6edf3" text-anchor="start">Provenance</text><text x="68" y="436" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9aa7b8" text-anchor="start">What the file proves about itself, independent of any score</text><rect x="500" y="403" width="167.04000000000002" height="21.5" rx="10.75" fill="#10302c" stroke="#10302c" stroke-width="1"/><text x="583.52" y="417.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#3ed3bd" text-anchor="middle">C2PA Content Credentials</text><rect x="675.04" y="403" width="142.2" height="21.5" rx="10.75" fill="#10302c" stroke="#10302c" stroke-width="1"/><text x="746.14" y="417.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#3ed3bd" text-anchor="middle">Generator watermarks</text><rect x="825.24" y="403" width="67.68" height="21.5" rx="10.75" fill="#10302c" stroke="#10302c" stroke-width="1"/><text x="859.08" y="417.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#3ed3bd" text-anchor="middle">Metadata</text><path d="M 150 360 L 150 378" fill="none" stroke="#3ed3bd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><path d="M 480 486 L 480 512" fill="none" stroke="#5f6f86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-arrow)"/><rect x="170" y="518" width="620" height="98" rx="14" fill="#161e2b" stroke="#6ea8ff" stroke-width="1.4" filter="url(#shadow)"/><text x="194" y="548" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="start">Verdict</text><text x="766" y="548" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ff7a93" text-anchor="end">fake</text><rect x="194" y="562" width="572" height="8" rx="4" fill="#1a2331" stroke="#1a2331" stroke-width="1"/><rect x="194" y="562" width="543" height="8" rx="4" fill="#ff7a93" stroke="#ff7a93" stroke-width="1"/><text x="194" y="596" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#9aa7b8" text-anchor="start">P(fake) 0.97</text><rect x="300" y="584" width="107.10000000000001" height="21" rx="10.5" fill="#241b3d" stroke="#241b3d" stroke-width="1"/><text x="353.55" y="597.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#b294ff" text-anchor="middle">confident: fake</text><rect x="415.1" y="584" width="124.92" height="21" rx="10.5" fill="#10302c" stroke="#10302c" stroke-width="1"/><text x="477.56" y="597.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#3ed3bd" text-anchor="middle">C2PA: AI-generated</text><rect x="548.02" y="584" width="184.32000000000002" height="21" rx="10.5" fill="#15233d" stroke="#15233d" stroke-width="1"/><text x="640.18" y="597.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6ea8ff" text-anchor="middle">face swap in 31 of 32 frames</text></svg>
