# AKS on NVIDIA GPU nodes, deployed by deploy/azure/deploy.sh aks-gpu (see docs/azure.md). The
# script's GPU node pool carries the label and taint of the generic gpu overlay, so its patch applies.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../aks
images:
  - name: forensix
    newName: ghcr.io/anas-rz/forensix
    newTag: gpu-bundled
patches:
  - path: gpu.yaml
    target: { kind: Deployment, name: forensix-manager }
  - path: gpu.yaml
    target: { kind: Deployment, name: forensix-inference }
  - target: { kind: HorizontalPodAutoscaler, name: forensix-inference }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 4
